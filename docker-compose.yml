version: "3.8"

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: casaos-filebrowser
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data/database.db:/database.db
      - ./data/config/settings.json:/.filebrowser.json
      - ./shared:/srv
      # Optional sources that will be linked into /srv/links
      - ./media:/mnt/media
      - ./downloads:/mnt/downloads
    command: >
      sh -c '
      mkdir -p /srv/links &&
      ln -sfn /mnt/media /srv/links/media &&
      ln -sfn /mnt/downloads /srv/links/downloads &&
      filebrowser --database /database.db --config /.filebrowser.json --root /srv
      '
